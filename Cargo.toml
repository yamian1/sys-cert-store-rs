[package]
name = "sys-cert-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust implementation of the sys-cert-store Linux certificate store API"
build = "build.rs"

[lib]
name = "sys_cert_store"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "certutil"
path = "src/bin/certutil.rs"

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
cms = { version = "0.3.0-pre.1", features = ["std"] }
const-oid = "0.10"
der = { version = "0.8", features = ["pem"] }
hex = "0.4"
foreign-types-shared = "0.1"
libc = "0.2"
md-5 = "0.10"
openssl = "0.10"
openssl-sys = "0.9"
p12-keystore = "0.3"
p256 = { version = "0.13", features = ["pkcs8"] }
p384 = { version = "0.13", features = ["pkcs8"] }
p521 = { version = "0.13", features = ["pkcs8"] }
parking_lot = "0.12"
pkcs8 = { version = "0.10", features = ["pem"] }
rand = "0.9"
rsa = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
x509-parser = { version = "0.18", features = ["verify"] }
x509-cert = "0.3"
walkdir = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
